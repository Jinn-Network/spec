# The repository's quality gate.
#
# `npm run check` asserts, among other things, that every committed group manifest is
# reproduced byte for byte from `documents/` and `inventory.json`, so a served document
# cannot be edited without its digest moving in a file that shows up in the diff. Nothing
# is deployed from this repository that has not passed this workflow first.

name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1

      - run: npm ci

      - run: npm run check
